name: PrismMoves test and release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Validate source and tag version
        run: |
          python -c "import os,tomllib,prismmoves; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert v==prismmoves.__version__; ref=os.getenv('GITHUB_REF',''); assert not ref.startswith('refs/tags/') or ref=='refs/tags/v'+v"
          cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prismmoves-dist
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prismmoves-dist
          path: dist
      - run: cd dist && sha256sum --check SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "PrismMoves $GITHUB_REF_NAME" --generate-notes
